<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Camvet Live Assistant</title>
<style>
  :root{
    --cv-navy:#22376e;
    --cv-navy-dark:#182852;
    --cv-accent:#677eae;
    --cv-accent-light:#eaeef7;
    --cv-grey-bg:#f4f6f8;
    --cv-grey-bubble:#eef1f4;
    --cv-text:#232a36;
    --cv-emergency:#d3382e;
    --cv-emergency-dark:#a92920;
    --cv-white:#ffffff;
  }
  *{box-sizing:border-box;}
  #cv-widget-root, #cv-widget-root *{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  #cv-widget-root{position:fixed;bottom:0;right:0;z-index:999999;width:0;height:0;}

  /* ---------- Launcher ---------- */
  #cv-launcher{
    position:fixed;bottom:20px;right:20px;width:64px;height:64px;border-radius:50%;
    background:var(--cv-navy);box-shadow:0 6px 18px rgba(0,0,0,.25);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    border:none;padding:0;overflow:hidden;transition:transform .15s ease;
  }
  #cv-launcher:hover{transform:scale(1.05);}
  #cv-launcher img{width:78%;height:78%;object-fit:contain;display:block;margin:auto;}
  #cv-launcher.cv-bounce{animation:cv-bounce .6s ease;}
  @keyframes cv-bounce{
    0%{transform:translateY(0);}
    30%{transform:translateY(-10px);}
    55%{transform:translateY(0);}
    75%{transform:translateY(-5px);}
    100%{transform:translateY(0);}
  }

  /* ---------- Teaser bubble ---------- */
  #cv-teaser{
    position:fixed;right:20px;bottom:94px;max-width:230px;
    background:var(--cv-navy-dark);color:#fff;padding:12px 30px 12px 14px;border-radius:16px;
    font-size:13.5px;line-height:1.35;box-shadow:0 6px 16px rgba(0,0,0,.22);
    opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .25s ease, transform .25s ease, bottom .2s ease;
  }
  #cv-teaser.cv-show{opacity:1;transform:translateY(0);pointer-events:auto;}
  #cv-teaser:after{
    content:"";position:absolute;right:24px;bottom:-7px;width:14px;height:14px;
    background:var(--cv-navy-dark);transform:rotate(45deg);border-radius:2px;
  }
  #cv-teaser-close{
    position:absolute;top:-8px;left:-8px;width:22px;height:22px;border-radius:50%;
    background:#fff;color:var(--cv-navy-dark);border:none;font-size:13px;line-height:1;
    cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.25);
  }
  @media (max-width:420px){
    #cv-teaser{max-width:180px;font-size:12.5px;right:14px;}
    #cv-launcher{right:14px;}
  }

  /* ---------- Card ---------- */
  #cv-card{
    position:fixed;bottom:96px;right:20px;width:360px;max-width:calc(100vw - 28px);
    height:520px;max-height:calc(100vh - 120px);background:#fff;border-radius:18px;
    box-shadow:0 12px 40px rgba(0,0,0,.28);display:none;flex-direction:column;overflow:hidden;
  }
  #cv-card.cv-open{display:flex;}
  @media (max-width:420px){
    #cv-card{right:14px;width:calc(100vw - 28px);}
  }

  /* header */
  .cv-header{background:var(--cv-navy);color:#fff;padding:14px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .cv-header .cv-avatar{width:40px;height:40px;border-radius:50%;background:var(--cv-navy-dark);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;}
  .cv-header .cv-avatar img{width:78%;height:78%;object-fit:contain;}
  .cv-header-text{flex:1;min-width:0;}
  .cv-header-text .cv-name{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:6px;}
  .cv-status-dot{width:8px;height:8px;border-radius:50%;background:#9aa4ad;flex-shrink:0;}
  .cv-status-dot.cv-open-now{background:#3ecf6e;}
  .cv-status-dot.cv-closed-now{background:#8a94a0;}
  .cv-header-text .cv-subline{font-size:11.5px;opacity:.85;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cv-header-actions{display:flex;align-items:center;gap:6px;flex-shrink:0;}
  .cv-emergency-btn{
    background:var(--cv-emergency);color:#fff;border:none;border-radius:20px;padding:6px 10px;
    font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block;
    box-shadow:0 2px 6px rgba(0,0,0,.25);
  }
  .cv-emergency-btn:hover{background:var(--cv-emergency-dark);}
  .cv-close-btn{background:rgba(255,255,255,.15);border:none;color:#fff;width:26px;height:26px;border-radius:50%;
    cursor:pointer;font-size:14px;line-height:1;flex-shrink:0;}

  @media (max-width:400px){
    .cv-header{flex-wrap:wrap;}
    .cv-emergency-btn{font-size:10px;padding:5px 8px;}
    .cv-header-text .cv-name{font-size:13px;}
  }

  /* menu view */
  #cv-menu{flex:1;overflow-y:auto;padding:18px 16px;background:#fff;}
  #cv-menu .cv-menu-avatar{width:64px;height:64px;border-radius:50%;background:var(--cv-navy);margin:0 auto 10px;overflow:hidden;display:flex;align-items:center;justify-content:center;}
  #cv-menu .cv-menu-avatar img{width:78%;height:78%;object-fit:contain;}
  #cv-menu .cv-greeting{text-align:center;font-size:15px;font-weight:600;color:var(--cv-text);margin-bottom:4px;}
  #cv-menu .cv-greeting-sub{text-align:center;font-size:12.5px;color:#5a6675;margin-bottom:16px;line-height:1.4;}
  #cv-status-badge{
    display:block;text-align:center;font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:20px;
    margin:0 auto 16px;width:fit-content;background:var(--cv-grey-bubble);color:#46525f;
  }
  #cv-status-badge.cv-open-now{background:#e6f7ec;color:#1f8a45;}
  #cv-status-badge.cv-closed-now{background:#f1f3f5;color:#5a6675;}

  .cv-menu-btn{
    display:block;width:100%;text-align:center;padding:12px 14px;border-radius:12px;border:none;
    font-size:14px;font-weight:600;cursor:pointer;margin-bottom:10px;text-decoration:none;
  }
  #cv-emergency-menu-btn{background:var(--cv-emergency);color:#fff;}
  #cv-emergency-menu-btn:hover{background:var(--cv-emergency-dark);}
  #cv-start-chat-btn{background:var(--cv-navy);color:#fff;}
  #cv-book-btn{background:var(--cv-accent-light);color:var(--cv-navy);border:1px solid #cdd6ea;}

  .cv-chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;justify-content:center;}
  .cv-chip{
    background:var(--cv-grey-bubble);border:1px solid #dfe4e9;color:var(--cv-navy);
    border-radius:16px;padding:7px 12px;font-size:12.5px;cursor:pointer;font-weight:500;
  }
  .cv-chip:hover{background:#e2e7ec;}

  /* chat view */
  #cv-chat{flex:1;display:none;flex-direction:column;overflow:hidden;}
  #cv-chat.cv-active{display:flex;}
  #cv-messages{flex:1;overflow-y:auto;padding:14px;background:var(--cv-grey-bg);display:flex;flex-direction:column;gap:10px;}
  .cv-msg{max-width:80%;padding:9px 12px;border-radius:14px;font-size:13.5px;line-height:1.4;}
  .cv-msg.cv-bot{background:#fff;color:var(--cv-text);align-self:flex-start;border-bottom-left-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .cv-msg.cv-user{background:var(--cv-navy);color:#fff;align-self:flex-end;border-bottom-right-radius:4px;}
  .cv-msg-links{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .cv-msg-links a{background:var(--cv-accent-light);color:var(--cv-navy);border-radius:14px;padding:6px 10px;font-size:12px;text-decoration:none;font-weight:600;}
  .cv-msg-suggestions{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .cv-msg-suggestions button{background:#fff;border:1px solid #dfe4e9;border-radius:14px;padding:6px 10px;font-size:12px;cursor:pointer;color:var(--cv-navy);}
  .cv-typing{align-self:flex-start;background:#fff;border-radius:14px;padding:10px 14px;box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .cv-typing span{width:6px;height:6px;background:#9aa4ad;border-radius:50%;display:inline-block;margin:0 2px;animation:cv-blink 1s infinite ease-in-out;}
  .cv-typing span:nth-child(2){animation-delay:.15s;}
  .cv-typing span:nth-child(3){animation-delay:.3s;}
  @keyframes cv-blink{0%,80%,100%{opacity:.25;}40%{opacity:1;}}

  #cv-input-row{display:flex;gap:8px;padding:10px;border-top:1px solid #e6e9ec;background:#fff;flex-shrink:0;}
  #cv-input{flex:1;border:1px solid #dfe4e9;border-radius:20px;padding:9px 14px;font-size:13.5px;outline:none;}
  #cv-input:focus{border-color:var(--cv-accent);}
  #cv-send{background:var(--cv-navy);border:none;color:#fff;width:38px;height:38px;border-radius:50%;cursor:pointer;flex-shrink:0;font-size:16px;}
  #cv-back-btn{background:none;border:none;color:var(--cv-accent);font-size:12px;cursor:pointer;padding:8px 10px 0;text-align:left;}
</style>
</head>
<body>

<div id="cv-widget-root">
  <button id="cv-launcher" aria-label="Open chat">
    <img id="cv-logo-launcher" alt="Camvet">
  </button>

  <div id="cv-teaser">
    <button id="cv-teaser-close" aria-label="Dismiss">&times;</button>
    <span id="cv-teaser-text">Hi I'm Camvet's assistant, here to help 24/7.</span>
  </div>

  <div id="cv-card">
    <div class="cv-header">
      <div class="cv-avatar">
        <img id="cv-logo-header" alt="Camvet">
      </div>
      <div class="cv-header-text">
        <div class="cv-name"><span class="cv-status-dot" id="cv-status-dot"></span>Camvet's Assistant</div>
        <div class="cv-subline" id="cv-header-subline">Mon&ndash;Fri 8am&ndash;5:30pm, Sat 8am&ndash;1pm</div>
      </div>
      <div class="cv-header-actions">
        <button id="cv-header-emergency" class="cv-emergency-btn">Emergency</button>
        <button id="cv-close-btn" class="cv-close-btn" aria-label="Close">&times;</button>
      </div>
    </div>

    <div id="cv-menu">
      <div class="cv-menu-avatar">
        <img id="cv-logo-menu" alt="Camvet">
      </div>
      <div class="cv-greeting">Hi I'm Camvet's assistant, here to help 24/7.</div>
      <div class="cv-greeting-sub">Ask me about large animal/equine services, hours, the team, or anything else &mdash; I'm here to help.</div>
      <span id="cv-status-badge">Checking hours&hellip;</span>

      <button id="cv-emergency-menu-btn" class="cv-menu-btn">&#9888; Pet emergency? Tap here</button>
      <button id="cv-start-chat-btn" class="cv-menu-btn">Start a new chat</button>
      <a href="#" id="cv-book-btn" class="cv-menu-btn">Book Online</a>

      <div class="cv-chip-row" id="cv-chip-row">
        <button class="cv-chip" data-q="What are your opening hours?">&#128337; Hours</button>
        <button class="cv-chip" data-q="Do you treat equine?">&#128014; Equine/Large Animal</button>
        <button class="cv-chip" data-q="Where are you located?">&#128205; Location</button>
        <button class="cv-chip" data-q="What payment methods do you accept?">&#128179; Payments</button>
      </div>
    </div>

    <div id="cv-chat">
      <button id="cv-back-btn">&larr; Back to menu</button>
      <div id="cv-messages"></div>
      <div id="cv-input-row">
        <input id="cv-input" type="text" placeholder="Ask a question...">
        <button id="cv-send" aria-label="Send">&#10148;</button>
      </div>
    </div>
  </div>
</div>

  /* =====================================================
     Dynamic open/closed status (clinic's own timezone)
     ===================================================== */
  function getClinicNow(){
    var parts = new Intl.DateTimeFormat('en-US', {
      timeZone: _CONFIG.clinicTimeZone,
      hour12:false, weekday:'short', hour:'2-digit', minute:'2-digit'
    }).formatToParts(new Date());
    var map = {};
    parts.forEach(function(p){ map[p.type] = p.value; });
    var dayMap = {Sun:'sun',Mon:'mon',Tue:'tue',Wed:'wed',Thu:'thu',Fri:'fri',Sat:'sat'};
    return { day: dayMap[map.weekday], hour: parseInt(map.hour,10), minute: parseInt(map.minute,10) };
  }

  function computeStatus(){
    var now = getClinicNow();
    var todayHours = _CONFIG.businessHours[now.day];
    if (!todayHours){
      return { open:false, known:true, label:"Closed today", subline:"Closed today &middot; after hours call " + _CONFIG.afterHoursPhone };
    }
    var nowMinutes = now.hour*60 + now.minute;
    var openParts = todayHours.open.split(":").map(Number);
    var closeParts = todayHours.close.split(":").map(Number);
    var openMinutes = openParts[0]*60+openParts[1];
    var closeMinutes = closeParts[0]*60+closeParts[1];
    var isOpen = nowMinutes >= openMinutes && nowMinutes < closeMinutes;
    return {
      open:isOpen, known:true,
      label: isOpen ? "Open now" : "Closed now",
      subline: isOpen ? ("Open until " + todayHours.close) : ("Currently closed &middot; after hours call " + _CONFIG.afterHoursPhone)
    };
  }

  function refreshStatus(){
    var status = computeStatus();
    statusDot.className = 'cv-status-dot' + (status.open ? ' cv-open-now' : ' cv-closed-now');
    statusBadge.textContent = status.label;
    statusBadge.className = status.open ? 'cv-open-now' : 'cv-closed-now';
    headerSubline.innerHTML = status.subline;

    // Emergency routing follows the dynamic status: the main line during
    // business hours, the real published after-hours line otherwise.
    headerEmergency.onclick = function(e){ e.preventDefault(); openEmergencyInChat(); };
    menuEmergencyBtn.onclick = function(e){ e.preventDefault(); openEmergencyInChat(); };
  }
  refreshStatus();
  setInterval(refreshStatus, 60000);

  var bounceTimer = null;

  var teaserDismissed = false;
  function positionTeaser(){

    if (card.classList.contains('cv-open')){

  }

  }, 1800);

    },
    {
      id:"birdcare",
      triggers:["bird","birds","aviary","cage bird"],
      answer:"Our team offers guidance on choosing a pet bird and on housing, environment, hygiene and diet for birds you already own. Give us a call on " + _CONFIG.phone + " if you have any bird questions."
    },
    {
      id:"payment",
      triggers:["payment methods","how can i pay","do you take card","afterpay","payment plan","zip pay","vetpay"],
      answer:"We offer Afterpay (four interest free instalments), VetPay (fast vet finance approval), and Zip Pay (flexible weekly, fortnightly or monthly repayments). For standard cash/card/EFTPOS options, please ask the team when you call on " + _CONFIG.phone + "."
    },
    {
      id:"insurance",
      triggers:["insurance","pet insurance","claim","gap payment"],
      answer:"We don't push one specific provider &mdash; our team can help you find a pet insurance option that suits your needs and your pet. Call " + _CONFIG.phone + " for a chat."
    },
    {
      id:"differentiator",
      triggers:["why choose","what makes you different","why camvet","special about"],
      answer:"We've served the Camden Haven community for over 40 years, treat a genuinely broad range of species from companion pets to large farm animals, and run modern in house diagnostics alongside a dedicated large animal/equine program, including a regular rural outreach clinic at Comboyne Showgrounds."
    },
    {
      id:"philosophy",
      triggers:["your story","your philosophy","tell me about camvet","about the clinic","your vision"],
      answer:"Camvet has served Camden Haven for over 40 years, and we aim to provide friendly, personalised care while using the latest education, equipment and technology to look after your pet's health."
    },
    {
      id:"symptom",
      triggers:SYMPTOM_TRIGGERS,
      answer:"I can't diagnose that over chat, so it's best to have a vet take a look. Book a consultation so we can properly check your pet &mdash; call " + _CONFIG.phone + " or book online. If things get noticeably worse quickly, please treat it as an emergency and call us straight away."
    },
    {
      id:"emergency",
      triggers:EMERGENCY_TRIGGERS,
      answer:"" // filled dynamically
    }
  ];

  var FALLBACK_ANSWER = "I'm not sure about that one. You can call us on " + _CONFIG.phone + " or email " + _CONFIG.email + " and the team will help directly.";

  function matchMessage(raw){
    var text = (raw || "").toLowerCase();

    // Emergency runs first and wins.
    if (contains(text, EMERGENCY_TRIGGERS)){
      return { id:"emergency", answer: emergencyAnswerText(), links: emergencyLinks() };
    }

    var best = null, bestScore = 0;
    for (var i=0;i<KB.length;i++){
      var intent = KB[i];
      if (intent.id === "emergency") continue; // handled above
      var score = 0;
      for (var j=0;j<intent.triggers.length;j++){
        if (text.indexOf(intent.triggers[j]) !== -1){ score += intent.triggers[j].length; }
      }
      if (score > bestScore){ bestScore = score; best = intent; }
    }
    if (best) return best;
    return { id:"fallback", answer: FALLBACK_ANSWER };
  }

  function openEmergencyInChat(){
    messagesEl.innerHTML = "";
    onboardingStage = 'done';
    openChatView();
    addMessage("Emergency", 'user');
    // Built directly rather than run through matchMessage(), since the
    // button's own label ("Emergency") is not itself one of the trigger
    // phrases we listen for in free-form user text.
    var match = { id:"emergency", answer: emergencyAnswerText(), links: emergencyLinks() };
    showTyping(function(){
      addMessage(match.answer, 'bot', match.links);
    });
  }

  /* =====================================================
     Chat rendering
     ===================================================== */
  function scrollToBottom(){ messagesEl.scrollTop = messagesEl.scrollHeight; }

  function addMessage(text, who, links, suggestions){
    var el = document.createElement('div');
    el.className = 'cv-msg cv-' + who;
    el.innerHTML = text;
    if (links && links.length){
      var linksWrap = document.createElement('div');
      linksWrap.className = 'cv-msg-links';
      links.forEach(function(l){
        var a = document.createElement('a');
        a.href = l.href; a.textContent = l.label;
        if (/^https?:/.test(l.href)){ a.target = "_blank"; a.rel = "noopener noreferrer"; }
        linksWrap.appendChild(a);
      });
      el.appendChild(linksWrap);
    }
    if (suggestions && suggestions.length){
      var sugWrap = document.createElement('div');
      sugWrap.className = 'cv-msg-suggestions';
      suggestions.forEach(function(s){
        var b = document.createElement('button');
        b.textContent = s;
        b.addEventListener('click', function(){ handleUserText(s); });
        sugWrap.appendChild(b);
      });
      el.appendChild(sugWrap);
    }
    messagesEl.appendChild(el);
    scrollToBottom();
  }

  function showTyping(cb){
    var el = document.createElement('div');
    el.className = 'cv-typing';
    el.innerHTML = "<span></span><span></span><span></span>";
    messagesEl.appendChild(el);
    scrollToBottom();
    setTimeout(function(){
      messagesEl.removeChild(el);
      cb();
    }, 500);
  }

  /* =====================================================
     Onboarding intake state machine
     ===================================================== */
  var onboardingStage = 'done'; // 'name' -> 'petname' -> 'condition' -> 'done'
  var ownerName = "", petName = "";

  function startIntake(){
    onboardingStage = 'name';
    addMessage("Before we dive in, what's your name?", 'bot');
  }

  function handleOnboarding(text){
    if (onboardingStage === 'name'){
      ownerName = text.trim();
      onboardingStage = 'petname';
      showTyping(function(){
        addMessage("Lovely to meet you, " + escapeHtml(ownerName) + "! What's your pet's name?", 'bot');
      });
      return;
    }
    if (onboardingStage === 'petname'){
      petName = text.trim();
      onboardingStage = 'condition';
      showTyping(function(){
        addMessage("Great &mdash; and what's going on with " + escapeHtml(petName) + " today? You can describe what's happening, or just ask me about booking, hours, services and more.", 'bot');
      });
      return;
    }
    if (onboardingStage === 'condition'){
      onboardingStage = 'done';
      var match = matchMessage(text);
      showTyping(function(){
        addMessage("Thanks, " + escapeHtml(ownerName) + " &mdash; noted for " + escapeHtml(petName) + ". " + match.answer, 'bot', match.links);
      });
      return;
    }
  }

  function escapeHtml(s){
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  function handleUserText(text){
    if (!text) return;
    addMessage(escapeHtml(text), 'user');
    if (onboardingStage !== 'done'){
      handleOnboarding(text);
      return;
    }
    var match = matchMessage(text);
    showTyping(function(){
      addMessage(match.answer, 'bot', match.links);
    });
  }

  inputEl.addEventListener('keydown', function(e){
    if (e.key === 'Enter'){ sendCurrentInput(); }
  });
  sendBtn.addEventListener('click', sendCurrentInput);
  function sendCurrentInput(){
    var v = inputEl.value;
    inputEl.value = "";
    handleUserText(v);
  }

  function openChatView(){
    menu.style.display = 'none';
    chat.classList.add('cv-active');
  }
  function openMenuView(){
    chat.classList.remove('cv-active');
    menu.style.display = 'block';
  }

  startChatBtn.addEventListener('click', function(){
    messagesEl.innerHTML = "";
    openChatView();
    onboardingStage = 'done'; // reset guard, then trigger intake explicitly
    startIntake();
  });

  backBtn.addEventListener('click', openMenuView);

  // Quick-intent chips: bypass intake entirely, feed straight into matcher.
  chipRow.addEventListener('click', function(e){
    var btn = e.target.closest('.cv-chip');
    if (!btn) return;
    var q = btn.getAttribute('data-q');
    messagesEl.innerHTML = "";
    onboardingStage = 'done'; // chips never trigger the name/pet intake
    openChatView();
    addMessage(escapeHtml(q), 'user');
    var match = matchMessage(q);
    showTyping(function(){
      addMessage(match.answer, 'bot', match.links);
    });
  });

  /* =====================================================
     Test harness (opt-in only via ?camvettest=1)
     ===================================================== */
  window.CAMVET_TEST = {
    cases: [
      { name:"equine bug fix", input:"Do you treat equine?", expectIntentId:"largeanimal", expectContains:"equine dentistry" },
      { name:"hours", input:"what are your hours on saturday", expectIntentId:"hours", expectContains:"1pm" },
      { name:"named toxin emergency", input:"my dog ate chocolate", expectIntentId:"emergency", expectContains:"phone call gets your pet seen fastest" },
      { name:"multi-symptom emergency combo", input:"vomiting and won't wake up", expectIntentId:"emergency", expectContains:"phone call gets your pet seen fastest" },
      { name:"non-emergency symptom", input:"my dog has a fever", expectIntentId:"symptom", expectNotContains:"phone call gets your pet seen fastest" },
      { name:"bare contact phrasing", input:"contact number", expectIntentId:"contact", expectContains:"(02) 6559 9828" },
      { name:"emergency false positive guard", input:"do you do blood tests?", expectIntentId:"xray", expectNotContains:"phone call gets your pet seen fastest" },
      { name:"booking with real url", input:"how do i book an appointment", expectIntentId:"booking", expectContains:"book online" },
      { name:"cat boarding phrasing", input:"do you offer cat boarding", expectIntentId:"boarding", expectContains:"12 months" },
      { name:"large animal species phrasing", input:"do you see cattle or alpacas", expectIntentId:"largeanimal", expectContains:"Comboyne" }
    ],
    runAll: function(){
      var pass = 0, fail = 0;
      this.cases.forEach(function(c){
        var result = matchMessage(c.input);
        var ok = true, reasons = [];
        if (c.expectIntentId && result.id !== c.expectIntentId){ ok = false; reasons.push("expected intent " + c.expectIntentId + " got " + result.id); }
        if (c.expectContains && result.answer.toLowerCase().indexOf(c.expectContains.toLowerCase()) === -1){ ok = false; reasons.push("missing text: " + c.expectContains); }
        if (c.expectNotContains && result.answer.toLowerCase().indexOf(c.expectNotContains.toLowerCase()) !== -1){ ok = false; reasons.push("should not contain: " + c.expectNotContains); }
        if (ok){ pass++; console.log("PASS", c.name); }
        else { fail++; console.warn("FAIL", c.name, reasons.join("; "), result); }
      });
      var statusResult = computeStatus();
      var statusOk = typeof statusResult.open === 'boolean';
      console.log(statusOk ? "PASS" : "FAIL", "status function well-formed", statusResult);
      console.log("CAMVET_TEST summary:", pass, "passed,", fail, "failed (+1 status check)");
      return { pass:pass, fail:fail };
    }
  };
  if (/[?&]camvettest=1/.test(window.location.search)){
    window.addEventListener('load', function(){ window.CAMVET_TEST.runAll(); });
  }

})();
</script>
</body>
</html>
